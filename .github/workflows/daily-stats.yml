name: Daily Stats Refresh

# 每天自动刷新：蛇形贡献图 / 仓库 pin 卡片 / stats / top-langs / 总 star(含 fork)
# 所有产物统一提交到当前分支(main)
on:
  schedule:
    - cron: '17 16 * * *'   # 每天 UTC 16:17（北京时间次日 00:17）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-stats.yml'
      - '.github/scripts/build_assets.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate snake (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: Dainsleif233
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-light
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build pin/stats/top-langs cards & update stars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Dainsleif233
        run: python .github/scripts/build_assets.py
      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily stats & pin refresh"
            git push
          fi